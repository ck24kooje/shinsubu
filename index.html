<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신수부 — 나에게 필요한 기운 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --paper:#F1E7CC; --card:#F8F1DE; --ink:#2E2418; --ink-soft:#5E4E38;
  --seal:#A82A1C; --seal-on:#FFFFFF; --line:#CDBB8E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1813; --card:#26211A; --ink:#EFE6D2; --ink-soft:#C2B49A;
    --seal:#D9574A; --seal-on:#1B1813; --line:#4C4333; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1813; --card:#26211A; --ink:#EFE6D2; --ink-soft:#C2B49A;
  --seal:#D9574A; --seal-on:#1B1813; --line:#4C4333; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  -webkit-tap-highlight-color:transparent;
}
.hanja{font-family:"Song Myung","Gowun Batang",serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 20px}
.screen{width:100%;max-width:640px;display:none;flex-direction:column;align-items:center;gap:24px;text-align:center;animation:fade .45s ease}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* frame like a talisman */
.frame{width:100%;border:3px solid var(--seal);padding:6px;background:var(--card)}
.frame>.inner{border:1px solid var(--seal);padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:18px}

.eyebrow{color:var(--seal);letter-spacing:.3em;font-size:.9rem}
h1{margin:0;font-weight:400;font-size:clamp(2.6rem,9vw,4rem);line-height:1.1;color:var(--seal)}
h1 small{display:block;font-family:"Gowun Batang",serif;font-size:1.05rem;color:var(--ink);letter-spacing:.05em;margin-top:10px}
.lead{margin:0;color:var(--ink-soft);line-height:1.8;font-size:1.05rem}

/* cover talisman (fixed paper colors in both themes) */
.talisman{--t-paper:#ECDCA6;--t-red:#A82A1C;--t-ink:#3A2A14;--t-hwang:#D6A42A;
  position:relative;width:100%;max-width:540px;color:var(--t-ink);padding:14px;
  background:
    radial-gradient(120% 80% at 20% 10%,rgba(255,250,230,.55),transparent 60%),
    radial-gradient(90% 70% at 85% 95%,rgba(170,120,40,.18),transparent 60%),
    var(--t-paper);
  border:4px solid var(--t-red);
  box-shadow:0 22px 44px -24px rgba(60,30,10,.55)}
.talisman::before{content:"";position:absolute;inset:9px;border:1px solid var(--t-red);pointer-events:none}
.talisman .corner{position:absolute;width:12px;height:12px;background:var(--t-red)}
.corner.tl{top:9px;left:9px}.corner.tr{top:9px;right:9px}.corner.bl{bottom:9px;left:9px}.corner.br{bottom:9px;right:9px}
.t-body{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:6px;padding:22px 10px 26px}
.t-side{writing-mode:vertical-rl;font-family:"Song Myung",serif;color:var(--t-red);font-size:1.15rem;letter-spacing:.55em;display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(168,42,28,.35)}
.t-side.left{border-left:none;border-right:1px solid rgba(168,42,28,.35)}
.t-main{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.t-head{background:var(--t-red);color:var(--t-paper);font-family:"Song Myung",serif;font-size:1.05rem;letter-spacing:.9em;padding:7px 8px 7px 22px}
.t-title{margin:0;font-family:"Song Myung",serif;font-weight:400;color:var(--t-red);font-size:clamp(3rem,12vw,4.4rem);line-height:1}
.t-sub{margin:-4px 0 0;font-size:1.02rem;line-height:1.7;letter-spacing:.06em;word-break:keep-all}
.t-lead{margin:0;line-height:1.85;font-size:1rem;color:#5E4A2E}
.talisman .btn{background:var(--t-red);color:#FFF8E8;box-shadow:0 0 0 3px var(--t-paper),0 0 0 4px var(--t-red)}
.compass{position:relative;width:min(100%,300px);aspect-ratio:1}
.compass svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--c);color:var(--on);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 0 0 3px var(--t-paper),0 0 0 4px var(--edge,var(--t-red))}
.node .hanja{font-size:clamp(1.15rem,5vw,1.55rem);line-height:1.05}
.node small{font-size:.68rem;letter-spacing:.1em;opacity:.92}
.center{position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);background:var(--t-hwang);color:var(--t-red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px var(--t-paper),0 0 0 4px var(--t-red)}
.center .hanja{font-size:clamp(1.6rem,7vw,2.2rem);line-height:1}
.center small{font-size:.66rem;letter-spacing:.12em;color:#5A3A08}
@media (max-width:400px){.t-body{grid-template-columns:minmax(0,1fr)}.t-side{display:none}}

.btn{appearance:none;border:none;cursor:pointer;font:inherit;min-height:56px;padding:14px 36px;font-size:1.15rem;font-weight:700;background:var(--seal);color:var(--seal-on);letter-spacing:.08em}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);font-weight:400;font-size:1rem;min-height:48px;padding:10px 22px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* question */
.q-body,.draw-body,.r-body{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 22px 26px}
.q-body{gap:18px}
.progress{display:flex;gap:12px;justify-content:center;padding:4px 0}
.progress i{width:12px;height:12px;border:1px solid var(--t-red);transform:rotate(45deg)}
.progress i.done{background:var(--t-red)}
.progress i.now{background:var(--t-hwang);box-shadow:0 0 0 2px var(--t-paper),0 0 0 3px var(--t-red)}
.qtext{margin:0;font-size:clamp(1.3rem,4.6vw,1.7rem);line-height:1.6;font-weight:700;word-break:keep-all;white-space:pre-line;color:var(--t-ink)}
.q-rule{display:flex;align-items:center;gap:8px;color:var(--t-red)}
.q-rule::before,.q-rule::after{content:"";width:46px;height:1px;background:var(--t-red)}
.q-rule span{width:7px;height:7px;background:var(--t-red);transform:rotate(45deg)}
.opts{display:flex;flex-direction:column;gap:11px;width:100%}
.opt{appearance:none;font:inherit;text-align:left;cursor:pointer;width:100%;min-height:62px;padding:11px 16px 11px 11px;background:rgba(255,250,232,.6);color:var(--t-ink);border:1px solid rgba(168,42,28,.45);font-size:1.05rem;line-height:1.55;display:flex;gap:14px;align-items:center;word-break:keep-all;transition:background .15s,color .15s}
.opt b{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--t-red);color:var(--t-paper);font-family:"Song Myung",serif;font-weight:400;font-size:1.25rem}
.opt:hover{background:rgba(255,250,232,.95)}
.opt.pick{background:var(--t-red);color:#FFF8E8;border-color:var(--t-red)}
.opt.pick b{background:var(--t-hwang);color:var(--t-red)}
.qfoot{display:flex;justify-content:space-between;width:100%;margin-top:4px}
.talisman .btn.ghost{background:transparent;color:var(--t-red);border:1px solid var(--t-red);box-shadow:none;font-weight:400;font-size:.98rem;min-height:46px;padding:8px 20px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #2E2418;outline-offset:3px}

/* draw */
.draw-body{gap:12px}
.stage{position:relative;width:min(100%,300px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.halo{position:absolute;width:84%;aspect-ratio:1;border-radius:50%;border:1px solid var(--t-red)}
.halo::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px dashed rgba(168,42,28,.5)}
.ring{position:absolute;width:84%;aspect-ratio:1;border-radius:50%;border:2px solid var(--c,#A82A1C);opacity:0}
.stage.reveal .ring{animation:ring 1.4s ease-out forwards}
@keyframes ring{0%{opacity:.8;transform:scale(.72)}100%{opacity:0;transform:scale(1.12)}}
.tube{position:relative;z-index:2;width:40%;height:auto;margin-top:12%;transform-origin:50% 95%;overflow:visible}
.tube.shake{animation:shake2 .75s ease-in-out infinite}
@keyframes shake2{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.tube.shake .sticks g{animation:jiggle .38s ease-in-out infinite alternate}
.tube.shake .sticks g:nth-child(2n){animation-delay:.19s}
@keyframes jiggle{to{transform:translateY(-5px)}}
.stick{transition:transform 1.1s cubic-bezier(.3,1.25,.5,1)}
.stick.up{transform:translateY(-72px)}
.draw-name{font-family:"Song Myung",serif;font-size:2.6rem;line-height:1;height:1em;opacity:0;transition:opacity .6s}
.draw-name.on{opacity:1}
.draw-text{margin:0;font-size:1.1rem;font-weight:700;color:var(--t-ink);min-height:1.6em}

/* result */
.r-body{gap:16px}
.r-body .t-head{letter-spacing:.4em;padding-left:14px}
.figure{position:relative;width:100%;display:flex;justify-content:center;padding:12px 0;border-top:1px solid var(--t-red);border-bottom:1px solid var(--t-red);overflow:hidden}
.figure img{position:relative;display:block;max-width:86%;max-height:min(56vh,520px);width:auto;height:auto;mix-blend-mode:multiply;animation:rise .7s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.rhanja{display:flex;align-items:baseline;gap:10px;color:var(--t-red)}
.rhanja .hanja{font-size:clamp(2.4rem,9vw,3.2rem);line-height:1}
.rhanja span:last-child{font-size:1rem;color:var(--t-ink);opacity:.75}
.rname{margin:0;font-size:clamp(1.5rem,5.6vw,2rem);font-weight:700;color:var(--t-ink)}
.rname em{font-style:normal;color:var(--t-red)}
.rdesc{margin:0;line-height:1.85;font-size:1.06rem;word-break:keep-all;white-space:pre-line;color:var(--t-ink)}
.rmsg{margin:0;padding:16px 18px;border-top:1px dashed var(--t-red);border-bottom:1px dashed var(--t-red);font-size:1.15rem;line-height:1.8;width:100%;word-break:keep-all;white-space:pre-line;color:var(--t-ink)}
.pickup{display:flex;align-items:center;gap:14px;background:var(--t-red);color:#FFFFFF;padding:14px 22px;font-size:1.1rem;font-weight:700;text-align:left;box-shadow:0 0 0 3px var(--t-paper),0 0 0 4px var(--t-red)}
.pickup .num{font-family:"Song Myung",serif;font-size:2.2rem;line-height:1;font-weight:400}
.count{color:var(--ink-soft);font-size:.9rem}
</style>
</head>
<body>
<main>

<!-- 시작 -->
<section class="screen on" id="home" aria-label="시작 화면">
  <div class="talisman">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="t-body">
      <div class="t-side left" aria-hidden="true">所願成就</div>
      <div class="t-main">
        <div class="t-head">四神符</div>
        <h1 class="t-title">신수부</h1>
        <p class="t-sub">사방의 신수가 그대에게<br>모자란 기운을 채워 주리라</p>
        <div class="compass" aria-hidden="true" id="compass"></div>
        <p class="t-lead">질문에 솔직하게 답하면<br>지금 나에게 부족한 기운을 채워 줄<br>수호신수가 정해집니다.</p>
        <button class="btn" id="startBtn">기운 알아보기</button>
      </div>
      <div class="t-side" aria-hidden="true">四方守護</div>
    </div>
  </div>
</section>

<!-- 질문 -->
<section class="screen" id="quiz" aria-label="질문">
  <div class="talisman">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="q-body">
      <div class="t-head" id="qnum"></div>
      <div class="progress" id="progress"></div>
      <p class="qtext" id="qtext"></p>
      <div class="q-rule" aria-hidden="true"><span></span></div>
      <div class="opts" id="opts"></div>
      <div class="qfoot">
        <button class="btn ghost" id="backBtn">이전 질문</button>
        <button class="btn ghost" id="homeBtn1">처음으로</button>
      </div>
    </div>
  </div>
</section>

<!-- 뽑기 -->
<section class="screen" id="draw" aria-label="산통 뽑기">
  <div class="talisman">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="draw-body">
      <div class="t-head">算筒</div>
      <div class="stage" id="stage">
        <div class="halo"></div>
        <div class="ring"></div>
        <svg class="tube" id="tube" viewBox="0 0 160 300" role="img" aria-label="산통을 흔드는 그림">
          <g class="sticks"><g><rect x="52" y="50" width="9" height="150" rx="2" fill="#E2C48A" stroke="#8C6A3C" stroke-width="1"/><rect x="52" y="50" width="9" height="20" rx="2" fill="#1E4D8C" stroke="#8C6A3C" stroke-width="1"/></g><g><rect x="62" y="38" width="9" height="162" rx="2" fill="#E2C48A" stroke="#8C6A3C" stroke-width="1"/><rect x="62" y="38" width="9" height="20" rx="2" fill="#B73A26" stroke="#8C6A3C" stroke-width="1"/></g><g><rect x="96" y="42" width="9" height="158" rx="2" fill="#E2C48A" stroke="#8C6A3C" stroke-width="1"/><rect x="96" y="42" width="9" height="20" rx="2" fill="#FFFFFF" stroke="#8C6A3C" stroke-width="1"/></g><g><rect x="106" y="52" width="9" height="148" rx="2" fill="#E2C48A" stroke="#8C6A3C" stroke-width="1"/><rect x="106" y="52" width="9" height="20" rx="2" fill="#2A2A30" stroke="#8C6A3C" stroke-width="1"/></g><g><rect x="86" y="34" width="9" height="166" rx="2" fill="#E2C48A" stroke="#8C6A3C" stroke-width="1"/><rect x="86" y="34" width="9" height="20" rx="2" fill="#D6A42A" stroke="#8C6A3C" stroke-width="1"/></g></g>
          <g class="stick" id="stick"><rect x="74" y="30" width="12" height="190" rx="2" fill="#EBCF94" stroke="#8C6A3C" stroke-width="1"/><rect x="74" y="30" width="12" height="28" rx="2" id="stickTip" fill="#EBCF94" stroke="#8C6A3C" stroke-width="1"/></g>
          <ellipse cx="80" cy="284" rx="46" ry="8" fill="#A82A1C"/>
          <rect x="34" y="125" width="92" height="159" fill="#A82A1C"/>
          <rect x="34" y="139" width="92" height="3" fill="#D6A42A"/>
          <rect x="34" y="268" width="92" height="3" fill="#D6A42A"/>
          <text x="80" y="222" text-anchor="middle" font-family="Song Myung, serif" font-size="40" fill="#F3E6C4">符</text>
          <ellipse cx="80" cy="125" rx="46" ry="9" fill="#6E170D"/>
        </svg>
      </div>
      <div class="draw-name" id="drawName"></div>
      <p class="draw-text" id="drawText"></p>
    </div>
  </div>
</section>

<!-- 결과 -->
<section class="screen result" id="result" aria-label="결과" aria-live="polite">
  <div class="talisman" id="rcard">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="r-body">
      <div class="t-head" id="rmeta"></div>
      <div class="figure" id="rfig"></div>
      <div class="rhanja" id="rhanja"></div>
      <p class="rname" id="rname"></p>
      <p class="rdesc" id="rdesc"></p>
      <p class="rmsg" id="rmsg"></p>
      <div class="pickup"><span class="num" id="rnum"></span><span id="rpick"></span></div>
    </div>
  </div>
  <button class="btn" id="homeBtn2">처음으로</button>
  <div class="count" id="count"></div>
</section>

</main>

function beastStyle(el, b){
  el.style.setProperty('--c', b.c); el.style.setProperty('--on', b.on);
  el.style.setProperty('--edge', b.edge || b.c);
}
function buildCompass(){
  const box = $('compass');
  const R = '#A82A1C';
  // ring, cross lines and ticks drawn like a talisman diagram
  let ticks = '';
  for (let i = 0; i < 24; i++){
    const a = i * Math.PI / 12, r1 = 47, r2 = i % 6 === 0 ? 43 : 45;
    ticks += `<line x1="${50 + r1 * Math.cos(a)}" y1="${50 + r1 * Math.sin(a)}" x2="${50 + r2 * Math.cos(a)}" y2="${50 + r2 * Math.sin(a)}" stroke="${R}" stroke-width=".5"/>`;
  }
  box.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="47" fill="none" stroke="${R}" stroke-width=".6"/>
    <circle cx="50" cy="50" r="36.5" fill="none" stroke="${R}" stroke-width=".5" stroke-dasharray="1.2 1.6"/>
    <line x1="50" y1="13" x2="50" y2="87" stroke="${R}" stroke-width=".6"/>
    <line x1="13" y1="50" x2="87" y2="50" stroke="${R}" stroke-width=".6"/>
    <rect x="30" y="30" width="40" height="40" fill="none" stroke="${R}" stroke-width=".5" transform="rotate(45 50 50)"/>
    ${ticks}</svg>`;
  const pos = { hyeon:[50,13], cheong:[87,50], ju:[50,87], baek:[13,50] };
  for (const k in pos){
    const b = BEASTS[k];
    const d = document.createElement('div'); d.className = 'node'; beastStyle(d, b);
    d.style.left = pos[k][0] + '%'; d.style.top = pos[k][1] + '%';
    d.innerHTML = `<span class="hanja">${b.hanja}</span><small>${b.dir} · ${b.name}</small>`;
    box.appendChild(d);
  }
  const c = document.createElement('div'); c.className = 'center';
  c.innerHTML = '<span class="hanja">符</span><small>中 · 黃</small>';
  box.appendChild(c);
}
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(goHome, IDLE_MS);
}
function goHome(){
  clearTimeout(idleTimer); clearInterval(countTimer);
  answers = []; idx = 0; show('home');
}
function renderQuestion(){
  const q = QUESTIONS[idx];
  $('progress').innerHTML = QUESTIONS.map((_,i) => `<i class="${i < idx ? 'done' : i === idx ? 'now' : ''}"></i>`).join('');
  $('qnum').textContent = `第${['一','二','三','四','五'][idx]}問`;
  $('qtext').textContent = q.q;
  const box = $('opts'); box.innerHTML = '';
  q.o.forEach(([text,key], i) => {
    const b = document.createElement('button'); b.className = 'opt';
    if (answers[idx] === key) b.classList.add('pick');
    b.innerHTML = `<b>${LETTERS[i]}</b><span></span>`;
    b.querySelector('span').textContent = text;
    b.addEventListener('click', () => choose(key, b));
    box.appendChild(b);
  });
  $('backBtn').style.visibility = idx === 0 ? 'hidden' : 'visible';
  show('quiz'); resetIdle();
}
function choose(key, el){
  el.classList.add('pick');
  answers[idx] = key;
  setTimeout(() => {
    if (idx < QUESTIONS.length - 1){ idx++; renderQuestion(); }
    else draw();
  }, 220);
}
function draw(){
  clearTimeout(idleTimer);
  const score = {cheong:0, ju:0, baek:0, hyeon:0};
  answers.forEach(k => score[k]++);
  const max = Math.max(...Object.values(score));
  const top = Object.keys(score).filter(k => score[k] === max);
  const key = top[Math.floor(Math.random() * top.length)];
  const b = BEASTS[key], T = THEME[key];

  const stage = $('stage'), stick = $('stick'), tube = $('tube'), nm = $('drawName');
  stage.classList.remove('reveal'); stick.classList.remove('up'); nm.classList.remove('on');
  $('stickTip').setAttribute('fill', '#EBCF94');
  stage.style.setProperty('--c', T.a);
  nm.textContent = ''; nm.style.color = T.a;
  $('drawText').textContent = top.length > 1
    ? '기운이 팽팽하여 산통이 직접 고르는 중…'
    : '산통을 흔들어 수호신수를 부르는 중…';
  show('draw'); tube.classList.add('shake');
  setTimeout(() => {
    tube.classList.remove('shake');
    $('stickTip').setAttribute('fill', key === 'baek' ? '#FFFFFF' : b.c);
    stick.classList.add('up');
    stage.classList.add('reveal');
    nm.textContent = b.hanja; nm.classList.add('on');
    $('drawText').textContent = `${b.name}${josa(b.name)} 응답했어요!`;
  }, 3200);
  setTimeout(() => showResult(b, key), 5200);
}
function showResult(b, key){
  key = key || Object.keys(BEASTS).find(k => BEASTS[k] === b);
  const T = THEME[key], card = $('rcard');
  card.style.setProperty('--t-red', T.a); card.style.setProperty('--t-paper', T.p);
  card.style.setProperty('--t-ink', T.i); card.style.setProperty('--glow', T.g);
  card.style.background = T.p;
  $('homeBtn2').style.background = T.a; $('homeBtn2').style.color = '#FFFFFF';
  $('rfig').innerHTML = `<img src="${b.img}" alt="한복을 입은 ${b.name} 캐릭터">`;
  $('rhanja').innerHTML = `<span class="hanja">${b.hanja}</span><span>${b.name}</span>`;
  $('rmeta').textContent = `${b.dir} · ${b.el}`;
  $('rname').innerHTML = `지금 당신에게 필요한 건<br><em>${b.need}의 기운</em>`;
  const breakLines = s => s.replace(/([.?!])\s+/g, '$1\n');
  $('rdesc').textContent = breakLines(b.desc);
  $('rmsg').textContent = `“${breakLines(b.msg)}”`;
  $('rnum').textContent = '符';
  $('rpick').textContent = `${b.name} 부적을 한 장 가져가세요`;
  show('result');
  let left = RESULT_MS / 1000;
  $('count').textContent = `${left}초 뒤 처음 화면으로 돌아가요`;
  clearInterval(countTimer);
  countTimer = setInterval(() => {
    left--;
    if (left <= 0){ goHome(); return; }
    $('count').textContent = `${left}초 뒤 처음 화면으로 돌아가요`;
  }, 1000);
}

$('startBtn').addEventListener('click', () => { answers = []; idx = 0; renderQuestion(); });
$('backBtn').addEventListener('click', () => { if (idx > 0){ idx--; renderQuestion(); } });
$('homeBtn1').addEventListener('click', goHome);
$('homeBtn2').addEventListener('click', goHome);
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => {
  if ($('quiz').classList.contains('on')) resetIdle();
}));
buildCompass();
</script>
</body>
</html>
